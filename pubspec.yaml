name: safesphere
description: AI-based women safety application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^6.3.3
  flutter_animate: ^4.5.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.1
  cloud_firestore: ^5.6.10
  firebase_messaging: ^15.2.9

  # Maps & Location
  geolocator: ^10.1.1
  google_maps_flutter: ^2.10.0
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # Permissions & Launchers
  permission_handler: ^12.0.1
  url_launcher: ^6.3.0

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.0.0

  # Networking
  http: ^1.6.0

  # Background Services
  flutter_background_service: ^5.1.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.3
  fl_chart: ^0.65.0
  flutter_map_cancellable_tile_provider: ^2.0.0
  flutter_tts: ^4.0.0
  sentry_flutter: ^8.0.0
  flutter_polyline_points: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  